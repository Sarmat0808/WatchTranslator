name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Perevodchik-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Perevodchik.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Переводчик (последняя версия)
          make_latest: true
          files: Perevodchik.apk
