name: Build APK

on:
  push:
    paths-ignore:
      - tools/**
      - .github/workflows/models.yml
      - README.md
      - web/**
      - .github/workflows/web.yml
      - .github/workflows/probe.yml
      - .github/workflows/voices.yml
      - .github/workflows/mttest.yml
  workflow_dispatch:

env:
  CI: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        timeout-minutes: 5
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Translation engine assets (Helsinki OPUS-MT, same as web version)
        timeout-minutes: 10
        run: bash tools/build_mt_assets.sh < /dev/null
      - name: Get sherpa-onnx (offline speech engine)
        run: |
          mkdir -p app/libs
          curl -sSL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -l app/libs
      - name: Build
        timeout-minutes: 35
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :mobile:assembleRelease --no-daemon --console=plain --stacktrace < /dev/null 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI log
          make_latest: false
          files: build.log
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Perevodchik.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk Perevodchik-Phone.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Переводчик (последняя версия)
          make_latest: true
          files: |
            Perevodchik.apk
            Perevodchik-Phone.apk
