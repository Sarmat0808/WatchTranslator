name: Probe web models
on:
  workflow_dispatch:
  push:
    paths:
      - tools/probe_mt.py
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install huggingface_hub
          python tools/probe_mt.py | tee probe.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI log
          make_latest: false
          files: probe.txt
