name: Web app (iPhone & any phone)

on:
  workflow_dispatch:
  push:
    paths:
      - web/**
      - tools/build_web.mjs
      - tools/webtest.mjs
      - tools/make_test_wavs.py
      - tools/convert_models.sh
      - .github/workflows/web.yml

concurrency:
  group: web
  cancel-in-progress: false

env:
  CI: "true"
  DEBIAN_FRONTEND: noninteractive
  PIP_NO_INPUT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  npm_config_yes: "true"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # ---------- 1. Модели перевода, которых нет готовыми (болгарский, эстонский, греческий, иврит) ----------
      - name: Cache converted models
        id: conv
        uses: actions/cache@v4
        with:
          path: converted
          key: converted-v2-${{ hashFiles('tools/convert_models.sh') }}
      - uses: actions/setup-python@v6
        if: steps.conv.outputs.cache-hit != 'true'
        with:
          python-version: "3.10"
      - name: Convert models to ONNX (quantized)
        if: steps.conv.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          mkdir -p webtest-out
          bash tools/convert_models.sh < /dev/null 2>&1 | tee webtest-out/convert.log
          test -s converted/list.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ---------- 2. Сборка сайта ----------
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install libraries
        timeout-minutes: 10
        run: |
          mkdir -p tools/webbuild && cd tools/webbuild
          npm init -y > /dev/null
          npm install --no-audit --no-fund --no-progress @huggingface/transformers@3.7.6 playwright@1
          ls node_modules/@huggingface/transformers/dist
      - name: Build site
        timeout-minutes: 5
        run: |
          node tools/build_web.mjs
          mkdir -p site/models
          cp -r converted/local site/models/
          du -sh site site/models site/ort site/vendor

      # ---------- 3. Автопроверка в движках Safari и Chrome ----------
      - name: Test voice clips
        timeout-minutes: 15
        run: |
          pip install -q sherpa-onnx==1.13.8 numpy scipy
          mkdir -p tts
          for f in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            curl -sSL -o tts/tts-$f https://github.com/Sarmat0808/WatchTranslator/releases/download/models/tts-$f
          done
          python tools/make_test_wavs.py tts site/test
      - name: Install test browsers
        timeout-minutes: 15
        working-directory: tools/webbuild
        run: npx --yes playwright install --with-deps chromium webkit
      - name: Browser tests
        timeout-minutes: 75
        run: |
          set -o pipefail
          mkdir -p webtest-out
          # жёсткий предел: тест сам завершается, даже если браузер завис
          timeout --signal=KILL 70m node tools/webtest.mjs < /dev/null 2>&1 | tee -a webtest-out/run.log
      - name: Publish test report
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-test
          name: Web test report
          make_latest: false
          files: webtest-out/*

      # ---------- 4. Публикация на GitHub Pages ----------
      - name: Remove test files
        timeout-minutes: 2
        run: rm -rf site/test
      - name: Deploy to GitHub Pages
        timeout-minutes: 30
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p webtest-out
          {
            echo "Files over 50 MB:"; find site -type f -size +50M -exec ls -la {} \;
            du -sh site
            cd site
            git init -q -b gh-pages
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git config http.postBuffer 1048576000
            git add -A
            git commit -q -m "Publish web app"
            git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          } < /dev/null 2>&1 | tee webtest-out/deploy.log
      - name: Publish deploy log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-test
          make_latest: false
          files: webtest-out/deploy.log
