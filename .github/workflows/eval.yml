name: Quality test FI-RU

# Сравнивает модели распознавания речи и перевода для финского и русского.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/eval_asr.py
      - tools/eval_mt.py
      - tools/eval_llm.py
      - tools/eval_phrases.py
      - .github/workflows/eval.yml

env:
  CI: "true"
  PIP_NO_INPUT: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  mt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Translation test
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers<4.50" sentencepiece sacremoses protobuf
          python tools/eval_mt.py 2>&1 | grep -v -i warn | tee eval-mt.txt
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ci-log
          make_latest: false
          files: eval-mt.txt
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download models
        run: |
          set -e
          pip install -q sherpa-onnx==1.13.8 numpy scipy
          mkdir -p tts m
          for f in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            curl -sSL -o tts/tts-$f https://github.com/Sarmat0808/WatchTranslator/releases/download/models/tts-$f
          done
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          cd m
          for n in sherpa-onnx-whisper-base sherpa-onnx-whisper-small sherpa-onnx-whisper-turbo sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8; do
            curl -sSL -o x.tar.bz2 $base/$n.tar.bz2 && tar xjf x.tar.bz2 && rm x.tar.bz2
          done
          ls -l */
      - name: Speech test
        run: python tools/eval_asr.py tts m 2>&1 | tee eval-asr.txt
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ci-log
          make_latest: false
          files: eval-asr.txt
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: llama.cpp
        run: |
          gh release download -R ggml-org/llama.cpp -p '*bin-ubuntu-x64.zip' -D llama
          cd llama && unzip -q *.zip && find . -name llama-server -type f
      - name: Test models
        run: |
          set -o pipefail
          SRV=$(find llama -name llama-server -type f | head -1)
          chmod +x $SRV
          export LD_LIBRARY_PATH=$(dirname $SRV):$LD_LIBRARY_PATH
          : > eval-llm.txt
          for spec in \
            "Gemma4-E2B|https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf" \
            "Gemma4-E4B|https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf" \
            "TranslateGemma-4B|https://huggingface.co/42ailab/TranslateGemma-4B-GGUF/resolve/main/translategemma-4b-it-Q4_K_M.gguf"; do
            name=${spec%%|*}; url=${spec#*|}
            echo "===== $name" | tee -a eval-llm.txt
            curl -sSL -o model.gguf "$url" || { echo "download failed" | tee -a eval-llm.txt; continue; }
            ls -l model.gguf | tee -a eval-llm.txt
            $SRV -m model.gguf --port 8080 -c 2048 -t 4 > server.log 2>&1 &
            PID=$!
            for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 2; done
            python tools/eval_llm.py "$name" 2>&1 | tee -a eval-llm.txt || tail -20 server.log | tee -a eval-llm.txt
            kill $PID; wait $PID 2>/dev/null; rm -f model.gguf
          done
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ci-log
          make_latest: false
          files: eval-llm.txt
